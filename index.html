<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#a18ac2"><title>Phố Vui · Một chiều bên hồ sen</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bc9ac1}#loading{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 70% 20%,#ffdc9b,#bc9ac1 60%,#505c94);display:grid;place-content:center;text-align:center;color:#493a32;font-family:Arial,sans-serif;transition:opacity .65s,transform .65s}#loading h1{font-size:64px;margin:8px;text-shadow:0 3px #f6e8cf}#loading .flower{font-size:85px;animation:breathe 1.8s infinite alternate}#loading .track{width:280px;height:12px;border:3px solid #f6e8cf;border-radius:12px;overflow:hidden;margin:20px auto;background:#a18ac2}#loadbar{height:100%;width:0;background:linear-gradient(90deg,#efbc77,#f6e8cf,#efbc77);background-size:200%;animation:shimmer 1s linear infinite}#loading.out{opacity:0;transform:scale(1.05);pointer-events:none}@keyframes breathe{to{transform:translateY(-12px) rotate(7deg)}}@keyframes shimmer{to{background-position:200%}}</style></head>
<body><div id="loading"><div class="flower">✿</div><h1>Phố Vui</h1><p>Một chiều bình yên, một phố thân quen.</p><div class="track"><div id="loadbar"></div></div><b id="loadpercent">0%</b></div><div id="game"></div><script>window.loadingProgress=0;window.loadingTimer=setInterval(()=>{window.loadingProgress=Math.min(20,window.loadingProgress+0.2);document.getElementById('loadbar').style.width=window.loadingProgress+'%';document.getElementById('loadpercent').textContent=Math.floor(window.loadingProgress)+'%';},100);</script><script type="module" src="./src/main.ts"></script></body></html>
